# .github/workflows/m2e-production-deployment.yml
name: M2E Production Deployment Engine

on:
  push:
    branches: [ "https://github.com/MTW24902/DCRCompaniesLLP/new/DCRCompanyLLP?repository_funding=1" ]
  pull_request:
    branches: [ "https://github.com/MTW24902/DCRCompaniesLLP/new/DCRCompanyLLP?repository_funding=1" ]

jobs
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js and Python Runtime Layers
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Python Security Audits & Core Tests
        run: |
          cd economic-engine
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy pytest
          pytest tests/ # Validates macroeconomic clipping algorithms

  build-and-push-images:
    needs: audit-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx Cluster
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Production Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Economic API Engine
        uses: docker/build-push-action@v5
        with:
          context: ./economic-engine
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/economic-api:latest
            ghcr.io/${{ github.repository }}/economic-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  execute-rolling-deployment:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Configure Production SSH Mesh Access
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_SWARM_MANAGER_IP }}
          username: cluster_deploy_agent
          key: ${{ secrets.SSH_PRODUCTION_PRIVATE_KEY }}
          script: |
            cd /opt/m2e-infrastructure
            # Pull down the validated image layer tags securely
            docker compose pull economic-engine-api
            # Execute rolling update: scales up temporary containers before replacing out-of-date targets
            docker compose up -d --no-deps --scale economic-engine-api=3 economic-engine-api
            # Verify internal node status
            docker ps | grep m2e-economic-api-service


# These are supported funding model platforms

github: # Replace with up to 4 GitHub Sponsors-enabled usernames e.g., [user1, user2]
patreon: # Replace with a single Patreon username
open_collective: # Replace with a single Open Collective username
ko_fi: # Replace with a single Ko-fi username
tidelift: # Replace with a single Tidelift platform-name/package-name e.g., npm/babel
community_bridge: # Replace with a single Community Bridge project-name e.g., cloud-foundry
liberapay: # Replace with a single Liberapay username
issuehunt: # Replace with a single IssueHunt username
lfx_crowdfunding: # Replace with a single LFX Crowdfunding project-name e.g., cloud-foundry
polar: # Replace with a single Polar username
buy_me_a_coffee: # Replace with a single Buy Me a Coffee username
thanks_dev: # Replace with a single thanks.dev username
custom: # Replace with up to 4 custom sponsorship URLs e.g., ['link1', 'link2']

# m2e-economic-engine-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m2e-economic-api-service
  namespace: m2e-core-production
  labels:
    app.kubernetes.io/name: m2e-economic-api
    app.kubernetes.io/part-of: m2e-economy-layer
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: m2e-economic-api
  template:
    metadata:
      labels:
        app: m2e-economic-api
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - m2e-economic-api
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: economic-api-engine
          image: ghcr.io/your-org/m2e-economic-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http-api
          resources:
            limits:
              cpu: "1000m"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: m2e-database-credentials
                  key: connection_string
            - name: REDIS_URL
              value: "redis-master.m2e-core-production.svc.cluster.local:6379"
            - name: CIRCUIT_BREAKER_WEBHOOK
              value: "https://internal.network"
          livenessProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http-api
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: m2e-economic-api-service
  namespace: m2e-core-production
spec:
  selector:
    app: m2e-economic-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: http-api
  type: ClusterIP
  # m2e-pod-failure-chaos.yaml
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: m2e-api-pod-termination-simulation
  namespace: m2e-core-production
spec:
  action: pod-failure
  mode: fixed
  value: '1' # Systematically terminates exactly 1 random active pod per event window
  duration: '30s' # Simulates a hard network or memory hardware failure for 30 seconds
  scheduler:
    cron: '@hourly' # Executes every single hour on the production cluster
  selector:
    namespaces:
      - m2e-core-production
    labelSelectors:
      app: m2e-economic-api
